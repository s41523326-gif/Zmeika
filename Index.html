<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Змейка</title>
  <style>
    :root {
      --bg: #0f0f14;
      --grid: #1a1a24;
      --snake: #3ddc84;
      --head: #5effa0;
      --food: #ff5a5a;
      --text: #e8e8ff;
      --timer: #b8f4ff;
      --score: #a0ffb0;
      --btn-bg: #2a2a3a;
      --btn-text: #e8e8ff;
      --overlay-bg: rgba(10,10,18,0.88);
    }
    [data-theme="light"] {
      --bg: #f0f2f8;
      --grid: #e0e4ee;
      --snake: #1a9e5a;
      --head: #0d7a40;
      --food: #e03030;
      --text: #1a1a2e;
      --timer: #0077cc;
      --score: #0d7a40;
      --btn-bg: #d8dce8;
      --btn-text: #1a1a2e;
      --overlay-bg: rgba(240,242,248,0.92);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: system-ui, -apple-system, sans-serif;
      color: var(--text);
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.3s, color 0.3s;
    }
    #wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 8px;
      gap: 8px;
    }
    #top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: min(96vw, 480px);
      max-width: 100%;
    }
    #timer {
      font-size: clamp(18px, 5vw, 26px);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--timer);
      letter-spacing: 1px;
    }
    #score {
      font-size: clamp(16px, 4vw, 22px);
      font-weight: 600;
      color: var(--score);
    }
    #themeBtn {
      width: 36px; height: 36px;
      border: none;
      border-radius: 50%;
      background: var(--btn-bg);
      color: var(--btn-text);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.15s;
    }
    #themeBtn:active { transform: scale(0.92); }
    canvas {
      display: block;
      border-radius: 8px;
      max-width: 96vw;
      max-height: calc(100vh - 100px);
      background: var(--grid);
      box-shadow: 0 4px 24px rgba(0,0,0,0.25);
    }
    #overlay {
      position: fixed;
      inset: 0;
      background: var(--overlay-bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 10;
      transition: background 0.3s;
    }
    #overlay.hidden { display: none; }
    #overlay h1 {
      font-size: clamp(28px, 8vw, 42px);
      font-weight: 700;
    }
    #overlay p {
      font-size: clamp(15px, 4vw, 18px);
      opacity: 0.75;
    }
    #startBtn {
      margin-top: 8px;
      padding: 14px 40px;
      font-size: 18px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      background: var(--snake);
      color: #fff;
      cursor: pointer;
      transition: transform 0.15s, filter 0.15s;
    }
    #startBtn:active { transform: scale(0.96); filter: brightness(0.9); }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="top">
      <div id="score">0</div>
      <div id="timer">—</div>
      <button id="themeBtn" aria-label="Тема">🌙</button>
    </div>
    <canvas id="c"></canvas>
  </div>

  <div id="overlay">
    <h1>Змейка</h1>
    <p>Свайп или стрелки</p>
    <button id="startBtn">Играть</button>
  </div>

  <script>
    // ─── Таймер ──────────────────────────────────────────────────
    const TARGET = new Date('2026-09-26T14:00:00');
    const timerEl = document.getElementById('timer');
    function updateTimer() {
      let diff = TARGET - Date.now();
      if (diff <= 0) { timerEl.textContent = '00:00:00:00'; return; }
      const d = Math.floor(diff / 86400000); diff %= 86400000;
      const h = Math.floor(diff / 3600000);  diff %= 3600000;
      const m = Math.floor(diff / 60000);    diff %= 60000;
      const s = Math.floor(diff / 1000);
      timerEl.textContent =
        String(d).padStart(2,'0') + ':' +
        String(h).padStart(2,'0') + ':' +
        String(m).padStart(2,'0') + ':' +
        String(s).padStart(2,'0');
    }
    updateTimer();
    setInterval(updateTimer, 1000);

    // ─── Тема ────────────────────────────────────────────────────
    const themeBtn = document.getElementById('themeBtn');
    let dark = true;
    themeBtn.addEventListener('click', () => {
      dark = !dark;
      document.documentElement.setAttribute('data-theme', dark ? '' : 'light');
      themeBtn.textContent = dark ? '🌙' : '☀️';
      draw();
    });

    // ─── Canvas ──────────────────────────────────────────────────
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const GRID = 16;
    let cell = 24;
    let size = GRID * cell;

    function resize() {
      const maxW = Math.min(window.innerWidth * 0.96, 480);
      const maxH = window.innerHeight - 90;
      cell = Math.floor(Math.min(maxW, maxH) / GRID);
      size = GRID * cell;
      canvas.width = size;
      canvas.height = size;
      if (typeof draw === 'function') draw();
    }
    window.addEventListener('resize', resize);

    // ─── Игра ────────────────────────────────────────────────────
    let snake = null, dir, nextDir, food = null, score = 0, alive = false, paused = false, lastMove = 0;
    const SPEED = 130;
    const scoreEl = document.getElementById('score');
    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('startBtn');

    function cssVar(name) {
      return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }

    function spawnFood() {
      let x, y, ok;
      do {
        x = Math.floor(Math.random() * GRID);
        y = Math.floor(Math.random() * GRID);
        ok = !snake.some(s => s.x === x && s.y === y);
      } while (!ok);
      food = { x, y };
    }

    function reset() {
      snake = [
        { x: 5, y: 8 },
        { x: 4, y: 8 },
        { x: 3, y: 8 }
      ];
      dir = { x: 1, y: 0 };
      nextDir = { ...dir };
      score = 0;
      scoreEl.textContent = '0';
      alive = true;
      paused = false;
      lastMove = performance.now();
      spawnFood();
      overlay.classList.add('hidden');
      draw();
    }

    function gameOver() {
      alive = false;
      overlay.querySelector('h1').textContent = 'Конец';
      overlay.querySelector('p').textContent = 'Счёт: ' + score;
      startBtn.textContent = 'Ещё раз';
      overlay.classList.remove('hidden');
    }

    function step() {
      if (!alive || paused) return;
      dir = { ...nextDir };
      let hx = snake[0].x + dir.x;
      let hy = snake[0].y + dir.y;

      // проход сквозь стены — выход с противоположной стороны
      if (hx < 0) hx = GRID - 1;
      else if (hx >= GRID) hx = 0;
      if (hy < 0) hy = GRID - 1;
      else if (hy >= GRID) hy = 0;

      const head = { x: hx, y: hy };

      if (snake.some(s => s.x === head.x && s.y === head.y)) {
        gameOver(); return;
      }

      snake.unshift(head);
      if (food && head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        spawnFood();
      } else {
        snake.pop();
      }
    }

    function draw() {
      const bg = cssVar('--grid');
      const sn = cssVar('--snake');
      const hd = cssVar('--head');
      const fd = cssVar('--food');

      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, size, size);

      ctx.strokeStyle = dark ? 'rgba(255,255,255,0.04)' : 'rgba(0,0,0,0.06)';
      ctx.lineWidth = 1;
      for (let i = 1; i < GRID; i++) {
        ctx.beginPath();
        ctx.moveTo(i * cell, 0); ctx.lineTo(i * cell, size);
        ctx.moveTo(0, i * cell); ctx.lineTo(size, i * cell);
        ctx.stroke();
      }

      if (food) {
        const pad = cell * 0.18;
        ctx.fillStyle = fd;
        roundRect(food.x * cell + pad, food.y * cell + pad, cell - pad*2, cell - pad*2, 6);
      }

      if (snake) {
        snake.forEach((s, i) => {
          const pad = cell * 0.12;
          ctx.fillStyle = i === 0 ? hd : sn;
          roundRect(s.x * cell + pad, s.y * cell + pad, cell - pad*2, cell - pad*2, 5);
        });
      }
    }

    resize(); // после объявления draw

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
      ctx.fill();
    }

    // ─── Клавиатура ──────────────────────────────────────────────
    const keyMap = {
      ArrowUp: [0,-1], ArrowDown: [0,1], ArrowLeft: [-1,0], ArrowRight: [1,0],
      w:[0,-1], s:[0,1], a:[-1,0], d:[1,0],
      W:[0,-1], S:[0,1], A:[-1,0], D:[1,0]
    };
    window.addEventListener('keydown', e => {
      if (e.code === 'Space') {
        if (alive) paused = !paused;
        e.preventDefault();
        return;
      }
      const v = keyMap[e.key];
      if (!v || !alive) return;
      const [dx, dy] = v;
      if (dx === -dir.x && dy === -dir.y) return;
      nextDir = { x: dx, y: dy };
      e.preventDefault();
    });

    // ─── Свайпы ──────────────────────────────────────────────────
    let touchStartX = 0, touchStartY = 0;
    canvas.addEventListener('touchstart', e => {
      const t = e.changedTouches[0];
      touchStartX = t.clientX;
      touchStartY = t.clientY;
    }, { passive: true });

    canvas.addEventListener('touchend', e => {
      if (!alive) return;
      const t = e.changedTouches[0];
      const dx = t.clientX - touchStartX;
      const dy = t.clientY - touchStartY;
      const absX = Math.abs(dx), absY = Math.abs(dy);
      if (Math.max(absX, absY) < 24) return;

      let nd;
      if (absX > absY) {
        nd = dx > 0 ? { x: 1, y: 0 } : { x: -1, y: 0 };
      } else {
        nd = dy > 0 ? { x: 0, y: 1 } : { x: 0, y: -1 };
      }
      if (nd.x === -dir.x && nd.y === -dir.y) return;
      nextDir = nd;
    }, { passive: true });

    startBtn.addEventListener('click', reset);

    function loop(t) {
      requestAnimationFrame(loop);
      if (alive && !paused && t - lastMove >= SPEED) {
        step();
        lastMove = t;
        draw();
      }
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
